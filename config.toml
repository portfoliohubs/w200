# ============================================
# SITE CONFIGURATION - PortfolioHubs
# ============================================
baseURL = "https://portfoliohubs.github.io/"
languageCode = "en"
defaultContentLanguage = "en"
title = "PortfolioHubs"
hasCJKLanguage = false
enableRobotsTXT = true
enableGitInfo = false
enableEmoji = true

# Sitemap Configuration
[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

# ============================================
# LANGUAGE SETTINGS
# ============================================
[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    title = "PortfolioHubs"
    
    [languages.en.params]
      description = "Professional Agency Websites & Digital Solutions. Creative portfolios, business websites, and digital marketing services."
    
  [languages.ar]
    languageName = "العربية"
    weight = 2
    languageDirection = "rtl"
    title = "بورتفوليو هبز | حلول رقمية احترافية"
    
    [languages.ar.params]
      description = "وكالة رقمية متخصصة في تصميم المواقع والحلول الرقمية. بورتفوليو احترافي، مواقع الأعمال، والتسويق الرقمي."

# ============================================
# AUTHOR & SOCIAL
# ============================================
[params]
  author = "PortfolioHubs Team"
  job_title_en = "Digital Agency & Web Solutions"
  job_title_ar = "وكالة رقمية وحلول ويب"
  avatar = "/assets/avatar.jpg"
  
  [params.social]
    facebook = "https://www.facebook.com/share/1DhxaHUvpk/"
    instagram = "https://www.instagram.com/portfoliohubs?igsh=MTF3d2tzcXU0cm41cw=="
    linkedin = "https://www.linkedin.com/in/michael-nabil-dev/"
    github = "https://github.com/yourusername"
    twitter = "https://twitter.com/yourhandle"

# ============================================
# STYLE SYSTEM - PortfolioHubs Brand Colors
# ============================================
[params.style]
  # Light Mode Colors
  bg_primary_light = "#C5D1D5"
  bg_secondary_light = "#FFFFFF"
  bg_surface_light = "#F8FAFC"
  text_primary_light = "#000000"
  text_secondary_light = "#333333"
  text_muted_light = "#666666"
  border_light = "#E2E8F0"
  
  # Brand Colors
  brand_primary = "#0055BB"
  brand_secondary = "#0077DD"
  brand_accent = "#FF8000"
  brand_dark = "#003388"
  
  # Status Colors
  success = "#10B981"
  warning = "#F59E0B"
  error = "#EF4444"
  
  # Fonts
  font_primary = "'Almarai', sans-serif"
  font_arabic = "'Almarai', sans-serif"
  font_mono = "'Courier New', monospace"

